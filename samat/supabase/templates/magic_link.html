<!doctype html>
<html lang="ar" dir="rtl">
<body style="margin:0;background:#F2EEE3;font-family:Tahoma,Arial,sans-serif;color:#2F231C">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px"><tr><td align="center">
    <table role="presentation" width="100%" style="max-width:480px;background:#FBF8F1;border:1px solid #E6DCC8;border-radius:20px;padding:28px;text-align:center">
      <tr><td>
        <h1 style="margin:0 0 6px;font-size:22px">سماط · SAMAT</h1>
        <p style="margin:0 0 18px">رمز الدخول إلى لوحة سماط / Your SAMAT sign-in code</p>
        <p style="margin:0 0 18px;font-size:34px;font-weight:bold;letter-spacing:8px" dir="ltr">{{ .Token }}</p>
        <p style="margin:0 0 18px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2F231C;color:#F2EEE3;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:bold">دخول مباشر · Sign in</a></p>
        <p style="margin:0;color:#6B5A4E;font-size:13px">الرمز صالح لمدة قصيرة. إذا ما طلبته، تجاهل هذه الرسالة.<br>The code expires soon. If you did not request it, ignore this e-mail.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>

name: Publish the سهم site

# Publishes the static site in sahm/ to GitHub Pages.
# In the repository: Settings, then Pages, then set Source to "GitHub Actions".

on:
  push:
    branches: [claude/coffee-brand-website-nexy7e]
    paths:
      - 'sahm/**'
      - '.github/workflows/sahm-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is whole before publishing
        run: |
          test -f sahm/index.html
          test -f sahm/assets/sahm-mark.png
          test -f sahm/assets/sahm-mark-light.png
          test -f sahm/assets/cup.jpg
          grep -q 'og:url' sahm/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sahm

      - id: deployment
        uses: actions/deploy-pages@v4

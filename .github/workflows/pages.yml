# نشر تلقائي للتطبيق على GitHub Pages مع كل تحديث
# يتطلّب مرة واحدة: Settings ← Pages ← Source = GitHub Actions
name: نشر على GitHub Pages

on:
  push:
    branches:
      - main
      - claude/islamic-app-maa-allah-7zlyyr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5

      - name: رفع ملفات التطبيق
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
